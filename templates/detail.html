{% extends "base.html" %}

{% block title %}{{ post['title'] }} - Scholar Board{% endblock %}

{% block content %}
<main class="flex-grow w-full max-w-4xl mx-auto px-4 md:px-8 py-10 md:py-16">
    <!-- Breadcrumb -->
    <div class="mb-2 flex items-center gap-2 text-on-primary-container text-[12px] font-semibold tracking-wider uppercase">
        <span class="material-symbols-outlined text-[16px]">campaign</span>
        <span>Academic Notice</span>
        <span class="text-outline-variant mx-1">&bull;</span>
        <span>Post #{{ post['id'] }}</span>
    </div>

    <!-- Post Content -->
    <article class="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <!-- Title Section -->
        <div class="p-8 border-b border-slate-100 bg-white">
            <h1 class="font-['Lexend'] text-[40px] leading-[1.2] font-bold text-primary mb-4">{{ post['title'] }}</h1>
            <div class="flex flex-wrap items-center gap-6 text-on-surface-variant text-[14px]">
                <div class="flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-[18px]">calendar_today</span>
                    <span>{{ post['created_at'][:10] }}</span>
                </div>
            </div>
        </div>
        <!-- Body Section -->
        <div class="p-8 md:p-12 max-w-none">
            <div class="font-['Inter'] text-[18px] leading-[1.6] text-on-surface-variant space-y-4 whitespace-pre-wrap">{{ post['content'] }}</div>
        </div>
    </article>

    <!-- Action Buttons -->
    <div class="mt-10 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3 w-full sm:w-auto">
            <a href="{{ url_for('list_posts') }}" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-6 py-3 bg-surface-container-highest text-on-surface-variant hover:bg-slate-200 rounded-lg transition-colors active:scale-95">
                <span class="material-symbols-outlined text-[20px]">format_list_bulleted</span>
                <span class="font-medium">List</span>
            </a>
        </div>
    </div>
</main>
{% endblock %}
