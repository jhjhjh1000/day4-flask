<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{% block title %}Scholar Board{% endblock %}</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                "on-error-container": "#93000a",
                "primary-container": "#131b2e",
                "primary-fixed-dim": "#bec6e0",
                "surface-dim": "#d8dadc",
                "on-tertiary-fixed": "#0b1c30",
                "on-secondary-container": "#fefcff",
                "on-primary-fixed-variant": "#3f465c",
                "tertiary-container": "#0b1c30",
                "on-primary-container": "#7c839b",
                "tertiary": "#000000",
                "secondary-fixed-dim": "#b4c5ff",
                "on-primary-fixed": "#131b2e",
                "on-tertiary-container": "#75859d",
                "inverse-on-surface": "#eff1f3",
                "surface-container": "#eceef0",
                "surface-container-high": "#e6e8ea",
                "surface-variant": "#e0e3e5",
                "surface-tint": "#565e74",
                "on-background": "#191c1e",
                "primary-fixed": "#dae2fd",
                "error": "#ba1a1a",
                "background": "#f7f9fb",
                "on-secondary-fixed": "#00174b",
                "secondary": "#0051d5",
                "surface-container-highest": "#e0e3e5",
                "error-container": "#ffdad6",
                "outline": "#76777d",
                "on-surface": "#191c1e",
                "surface-container-low": "#f2f4f6",
                "tertiary-fixed-dim": "#b7c8e1",
                "secondary-fixed": "#dbe1ff",
                "inverse-surface": "#2d3133",
                "surface-bright": "#f7f9fb",
                "on-secondary-fixed-variant": "#003ea8",
                "inverse-primary": "#bec6e0",
                "on-primary": "#ffffff",
                "on-error": "#ffffff",
                "on-surface-variant": "#45464d",
                "tertiary-fixed": "#d3e4fe",
                "on-secondary": "#ffffff",
                "primary": "#000000",
                "surface-container-lowest": "#ffffff",
                "outline-variant": "#c6c6cd",
                "on-tertiary-fixed-variant": "#38485d",
                "secondary-container": "#316bf3",
                "surface": "#f7f9fb",
                "on-tertiary": "#ffffff"
            },
            borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
            spacing: { sm: "12px", base: "8px", xl: "64px", lg: "40px", gutter: "24px", xs: "4px", "container-max": "1280px", md: "24px" },
            fontFamily: { h2: ["Lexend"], "body-lg": ["Inter"], "label-caps": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], h3: ["Lexend"], h1: ["Lexend"] },
            fontSize: {
                h2: ["32px", { lineHeight: "1.3", letterSpacing: "-0.01em", fontWeight: "600" }],
                "body-lg": ["18px", { lineHeight: "1.6", letterSpacing: "0", fontWeight: "400" }],
                "label-caps": ["12px", { lineHeight: "1", letterSpacing: "0.05em", fontWeight: "600" }],
                "body-sm": ["14px", { lineHeight: "1.5", letterSpacing: "0", fontWeight: "400" }],
                "body-md": ["16px", { lineHeight: "1.5", letterSpacing: "0", fontWeight: "400" }],
                h3: ["24px", { lineHeight: "1.4", letterSpacing: "0", fontWeight: "600" }],
                h1: ["40px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "700" }]
            }
        }
    }
}
</script>
<style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-50">
<div class="flex justify-between items-center w-full px-4 md:px-8 h-16 max-w-7xl mx-auto">
    <div class="flex items-center gap-8">
        <a href="{{ url_for('list_posts') }}" class="text-xl font-bold tracking-tight text-slate-900 font-['Lexend']">Scholar Board</a>
        <nav class="hidden md:flex gap-6 items-center">
            <a class="text-slate-500 hover:text-slate-900 transition-colors font-['Lexend']" href="#">Dashboard</a>
            <a class="text-slate-500 hover:text-slate-900 transition-colors font-['Lexend']" href="#">Courses</a>
            <a class="text-slate-500 hover:text-slate-900 transition-colors font-['Lexend']" href="#">Community</a>
            <a class="text-blue-700 font-semibold border-b-2 border-blue-700 pb-1 font-['Lexend']" href="{{ url_for('list_posts') }}">Notices</a>
        </nav>
    </div>
    <div class="flex items-center gap-4">
        <div class="hidden md:flex items-center bg-surface-container rounded-full px-4 py-1.5 gap-2">
            <span class="material-symbols-outlined text-on-surface-variant text-[20px]">search</span>
            <input class="bg-transparent border-none focus:ring-0 text-[14px] w-48" placeholder="Search notices..." type="text"/>
        </div>
        <button class="p-2 text-slate-500 hover:bg-slate-50 rounded-lg active:scale-95 transition-all">
            <span class="material-symbols-outlined">notifications</span>
        </button>
        <button class="p-2 text-slate-500 hover:bg-slate-50 rounded-lg active:scale-95 transition-all">
            <span class="material-symbols-outlined">account_circle</span>
        </button>
    </div>
</div>
</header>

{% block content %}{% endblock %}

<!-- Footer -->
<footer class="bg-slate-50 border-t border-slate-200 w-full mt-auto">
<div class="flex flex-col md:flex-row justify-between items-center py-8 px-4 md:px-8 max-w-7xl mx-auto gap-4 font-['Lexend'] text-sm">
    <div class="flex flex-col md:flex-row items-center gap-4 md:gap-8">
        <span class="font-semibold text-slate-900">Scholar Board</span>
        <div class="flex gap-4">
            <a class="text-slate-500 hover:text-slate-900 transition-opacity" href="#">Academic Integrity</a>
            <a class="text-slate-500 hover:text-slate-900 transition-opacity" href="#">Privacy Policy</a>
            <a class="text-slate-500 hover:text-slate-900 transition-opacity" href="#">Help Center</a>
        </div>
    </div>
    <p class="text-slate-600">&copy; 2024 English Academy. All rights reserved.</p>
</div>
</footer>
</body>
</html>
